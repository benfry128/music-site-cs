name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Get AWS CLI and lightsailctl
        run: |
          aws --version
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
          which aws
          aws --version
          sudo curl "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o "/usr/local/bin/lightsailctl"
          sudo chmod +x /usr/local/bin/lightsailctl
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ARN }}
          role-session-name: Github
          aws-region: us-east-1
      
      - name: Build
        run: |
          docker build -t benfrymusic -f BenFryMusic/dockerfile .
      
      - name: Push to lightsail
        run: |
          aws lightsail push-container-image --region us-east-1 --service-name benfrymusic --label benfrymusic --image benfrymusic:latest
          
      - name: Start Lightsail deployment
        run: |
          aws lightsail create-container-service-deployment --region us-east-1 --service-name benfrymusic --containers '{ \"benfrymusic\": {\"image\": \":benfrymusic.benfrymusic.latest\", \"ports\": {\"8080\": \"HTTP\"}}}' --public-endpoint '{ \"containerName\": \"benfrymusic\", \"containerPort\": 8080, \"healthCheck\": { \"path\": \"/health\", \"intervalSeconds\": 5 }}'
